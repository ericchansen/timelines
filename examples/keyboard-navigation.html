<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A keyboard-navigable synthetic timeline with independent focus and selection.">
  <title>Keyboard timeline navigation</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
  </style>
  <link rel="stylesheet" href="../src/timeline/timeline.css">
</head>
<body>
  <main class="tl-page">
    <div class="tl-shell tl-shell--reading">
      <header class="tl-page-header">
        <h1>Keyboard timeline navigation</h1>
        <p>Arrow keys move focus; Enter or Space pins a selection. Focus and selection stay independent so exploration never changes state unexpectedly.</p>
      </header>

      <section class="tl-panel" aria-labelledby="events-title">
        <div class="tl-panel-header">
          <h2 id="events-title">Synthetic events</h2>
          <p id="instructions">Use Up/Down, Home/End, Enter, and Space.</p>
        </div>
        <div class="tl-listbox" id="timeline" role="listbox" aria-describedby="instructions"></div>
        <div class="tl-status">
          <span><strong>Focused:</strong> <span id="focused-label">None</span></span>
          <span><strong>Pinned:</strong> <span id="selected-label">None</span></span>
        </div>
        <div class="tl-live" id="live-status" role="status" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <script src="../src/timeline/timeline.js"></script>
  <script src="../src/fixtures/synthetic-events.js"></script>
  <script>
    (() => {
      "use strict";

      const timeline = window.TimelineKit;
      const events = window.SYNTHETIC_TIMELINE_EVENTS;
      const listbox = document.getElementById("timeline");
      let selectedId = null;

      events.forEach((event) => {
        const item = document.createElement("div");
        item.className = "tl-listbox-item";
        item.dataset.eventId = event.id;
        item.dataset.selected = "false";
        item.setAttribute("role", "option");
        item.setAttribute("aria-selected", "false");
        item.innerHTML = `
          <span class="tl-listbox-marker" aria-hidden="true"></span>
          <span class="tl-listbox-copy">
            <strong>${event.label}</strong>
            <span class="tl-badge tl-badge--${event.category}">${event.category}</span>
          </span>
          <time class="tl-time" datetime="${event.timestamp}">${timeline.formatUtc(event.timestamp, { seconds: true })}</time>
        `;
        listbox.append(item);
      });

      const items = Array.from(listbox.children);

      function pin(index) {
        const event = events[index];
        selectedId = event.id;
        timeline.applySelectionState(items, selectedId);
        document.getElementById("selected-label").textContent = event.label;
        document.getElementById("live-status").textContent = `${event.label} pinned.`;
      }

      timeline.createRovingFocus(items, {
        orientation: "vertical",
        onFocus(index) {
          document.getElementById("focused-label").textContent = events[index].label;
        },
        onSelect: pin
      });

      timeline.applyEmbedMode();
    })();
  </script>
</body>
</html>
