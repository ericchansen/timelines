<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A semantic timeline feed grouped from synthetic UTC event data.">
  <title>Semantic timeline feed</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
  </style>
  <link rel="stylesheet" href="../src/timeline/timeline.css">
</head>
<body>
  <main class="tl-page">
    <div class="tl-shell tl-shell--reading">
      <header class="tl-page-header">
        <h1>Semantic timeline feed</h1>
        <p>A non-interactive reading pattern that groups events by meaning. Solid and dashed geometry keeps categories distinct without relying on color.</p>
      </header>

      <section class="tl-panel" aria-labelledby="feed-title">
        <div class="tl-panel-header">
          <h2 id="feed-title">Synthetic activity</h2>
          <p>Newest first within each category</p>
        </div>
        <div class="tl-feed" id="feed"></div>
        <div class="tl-legend" aria-label="Category key">
          <span class="tl-legend-item" data-category="deployment">
            <span class="tl-legend-symbol" aria-hidden="true">D</span>
            Deployment · solid ring
          </span>
          <span class="tl-legend-item" data-category="monitoring">
            <span class="tl-legend-symbol" aria-hidden="true">M</span>
            Monitoring · dashed ring
          </span>
        </div>
      </section>
    </div>
  </main>

  <script src="../src/timeline/timeline.js"></script>
  <script src="../src/fixtures/synthetic-events.js"></script>
  <script>
    (() => {
      "use strict";

      const timeline = window.TimelineKit;
      const feed = document.getElementById("feed");
      const categories = ["deployment", "monitoring"];

      categories.forEach((category, index) => {
        const events = window.SYNTHETIC_TIMELINE_EVENTS
          .filter((event) => event.category === category)
          .sort((first, second) => timeline.toMillis(second.timestamp) - timeline.toMillis(first.timestamp));
        const section = document.createElement("section");
        const marker = document.createElement("div");
        const content = document.createElement("div");

        section.className = "tl-feed-group";
        section.dataset.category = category;
        marker.className = "tl-feed-marker";
        marker.textContent = category.slice(0, 1).toUpperCase();
        marker.setAttribute("aria-hidden", "true");
        content.className = "tl-feed-content";
        content.innerHTML = `<h2>${index + 1}. ${category.slice(0, 1).toUpperCase()}${category.slice(1)} events</h2>`;

        const eventList = document.createElement("div");
        eventList.className = "tl-feed-events";

        events.forEach((event) => {
          const article = document.createElement("article");
          article.className = "tl-feed-event";
          article.innerHTML = `
            <time class="tl-time" datetime="${event.timestamp}">${timeline.formatUtc(event.timestamp, { seconds: true })}</time>
            <h3>${event.label}</h3>
            <span class="tl-badge tl-badge--${event.category}">${event.category}</span>
            <p>${event.description}</p>
          `;
          eventList.append(article);
        });

        content.append(eventList);
        section.append(marker, content);
        feed.append(section);
      });

      timeline.applyEmbedMode();
    })();
  </script>
</body>
</html>
